name: android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest runners already ship an Android SDK (ANDROID_SDK_ROOT
      # preset); only the exact platform / build-tools are missing.
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS=$(ls -d "$SDK"/cmdline-tools/* | head -1)
          yes | "$TOOLS/bin/sdkmanager" --licenses > /dev/null
          "$TOOLS/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
