name: Android CI

on:
  push:
    branches: [ "main", "feat/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_NUMBER: ${{ github.run_number }}
  COMMIT_SHA: ${{ github.sha }}

jobs:
  # ============================================================
  # Job 1: Debug 构建
  # ============================================================
  build-debug:
    name: Build Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.BUILD_NUMBER }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 2: Release 构建（未签名）
  # ============================================================
  build-release:
    name: Build Release (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-${{ env.BUILD_NUMBER }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # Job 3: 质量检查（矩阵：lint + unit test）
  # ============================================================
  quality:
    name: Quality (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        task: [ lintDebug, testDebugUnitTest ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run ${{ matrix.task }}
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload ${{ matrix.task }} reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.task }}-${{ env.BUILD_NUMBER }}
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

  # ============================================================
  # Job 4: 汇总报告
  # ============================================================
  report:
    name: Report
    needs: [ build-debug, build-release, quality ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f | sort

      # ---------- 构建元信息 ----------
      - name: Generate build-info.json
        run: |
          mkdir -p out
          cat > out/build-info.json <<EOF
          {
            "workflow": "${{ github.workflow }}",
            "run_number": ${{ github.run_number }},
            "run_id": ${{ github.run_id }},
            "commit": "${{ github.sha }}",
            "commit_short": "${COMMIT_SHA:0:7}",
            "ref": "${{ github.ref }}",
            "event": "${{ github.event_name }}",
            "actor": "${{ github.actor }}",
            "repository": "${{ github.repository }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat out/build-info.json

      # ---------- Checksum ----------
      - name: Generate checksums
        run: |
          mkdir -p out
          cd artifacts
          find . -type f \( -name "*.apk" -o -name "*.aab" \) | sort | while read f; do
            sha256sum "$f"
          done > ../out/checksums.txt || true
          cd ..
          cat out/checksums.txt

      # ---------- APK 体积 ----------
      - name: APK size report
        run: |
          mkdir -p out
          echo "| APK | 文件大小 | 下载大小 |" > out/apk-size-report.md
          echo "|---|---|---|" >> out/apk-size-report.md

          ANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          [ -x "$ANALYZER" ] || ANALYZER=$(command -v apkanalyzer || true)

          find artifacts -type f -name "*.apk" | sort | while read apk; do
            NAME=$(basename "$apk")
            FILE_SIZE=$(ls -lh "$apk" | awk '{print $5}')
            if [ -n "$ANALYZER" ] && [ -x "$ANALYZER" ]; then
              DL_SIZE=$("$ANALYZER" apk download-size "$apk" 2>/dev/null || echo "N/A")
            else
              DL_SIZE="N/A"
            fi
            echo "| $NAME | $FILE_SIZE | $DL_SIZE |" >> out/apk-size-report.md
          done

          cat out/apk-size-report.md

      # ---------- 上传报告 ----------
      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ env.BUILD_NUMBER }}
          path: |
            out/build-info.json
            out/checksums.txt
            out/apk-size-report.md
          retention-days: 7

      # ---------- Step Summary ----------
      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Android CI 构建报告"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 运行编号 | #${{ env.BUILD_NUMBER }} |"
            echo "| Commit | \`${COMMIT_SHA:0:7}\` |"
            echo "| 触发事件 | ${{ github.event_name }} |"
            echo "| 构建时间 | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo ""
            echo "### 流水线状态"
            echo ""
            echo "| Job | 结果 |"
            echo "|---|---|"
            echo "| build-debug | ${{ needs.build-debug.result }} |"
            echo "| build-release | ${{ needs.build-release.result }} |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo ""
            echo "### 依赖图"
            echo ""
            echo '```mermaid'
            echo 'graph LR'
            echo '  A[build-debug] --> R[report]'
            echo '  B[build-release] --> R'
            echo '  C[quality] --> R'
            echo '```'
            echo ""
            echo "### APK 体积"
            echo ""
            cat out/apk-size-report.md
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat out/checksums.txt
            echo '```'
            echo ""
            echo "### 构建元信息"
            echo ""
            echo '```json'
            cat out/build-info.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"